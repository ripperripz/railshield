services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: railshield
      POSTGRES_USER: railshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U railshield -d railshield]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: ./backend
    environment: &backend-env
      RAILSHIELD_ENVIRONMENT: production
      RAILSHIELD_DATABASE_URL: postgresql+psycopg://railshield:${POSTGRES_PASSWORD}@db:5432/railshield
      RAILSHIELD_API_KEY: ${RAILSHIELD_API_KEY:?Set RAILSHIELD_API_KEY in .env}
      RAILSHIELD_CORS_ORIGINS: ${RAILSHIELD_CORS_ORIGINS:-["http://localhost:8080"]}
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: ./backend
    environment: *backend-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  worker:
    build: ./backend
    environment: *backend-env
    command: [python, -m, app.worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    stop_grace_period: 90s
  web:
    build: ./frontend
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://localhost:8080/health/ready]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
